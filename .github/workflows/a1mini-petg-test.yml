name: Build A1 Mini PETG test APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/a1mini-stl-petg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 34
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Run JVM tests (non-blocking for test APK)
        run: ./gradlew testDebugUnitTest --no-daemon || true
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a1mini-petg-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
