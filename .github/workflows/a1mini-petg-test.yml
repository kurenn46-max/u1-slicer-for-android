name: Build A1 Mini PETG test APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/a1mini-stl-petg

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 34
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Run JVM tests (non-blocking for test APK)
        run: ./gradlew testDebugUnitTest --no-daemon || true
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK installability
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --verbose --min-sdk-version 35 "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          # Re-align APK for Android 15/16 16 KB page-size devices, then re-sign.
          cp "$APK" /tmp/app-unaligned.apk
          "$ZIPALIGN" -f -P 16 4 /tmp/app-unaligned.apk /tmp/app-16k.apk
          mv /tmp/app-16k.apk "$APK"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          rm -rf /tmp/apk-libs && mkdir -p /tmp/apk-libs
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d /tmp/apk-libs
          for SO in /tmp/apk-libs/lib/arm64-v8a/*.so; do
            echo "=== ELF LOAD alignment: $SO ==="
            readelf -lW "$SO" | grep LOAD
            if readelf -lW "$SO" | grep LOAD | awk '{print $NF}' | grep -Eiq '0x(1000|2000)'; then
              echo "::error::$SO has a LOAD segment below 16 KB alignment"
              exit 1
            fi
          done
          "$AAPT" dump badging "$APK" | head -30
          unzip -l "$APK" | grep 'lib/.*\.so' | head -50
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: a1mini-petg-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct-download test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk YourOneSlicer-A1mini-PETG-fix.apk
          gh release delete a1mini-petg-test --yes --cleanup-tag || true
          gh release create a1mini-petg-test YourOneSlicer-A1mini-PETG-fix.apk --title "A1 Mini PETG Test Build" --notes "Test build for single-STL PETG material override on Bambu Lab A1 mini." --prerelease --target "${GITHUB_SHA}"
