name: NIGHT PRINT ARM64 dependency stage 2
on:
  pull_request:
    paths:
      - '.github/workflows/nightprint-arm64-stage2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightprint-arm64-stage2
  cancel-in-progress: true
jobs:
  stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select NDK26
        run: |
          set -euo pipefail
          mkdir -p deps-stage2
          NDK="$ANDROID_HOME/ndk/26.1.10909125"
          if [ ! -d "$NDK" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            "$SDKMGR" "ndk;26.1.10909125"
          fi
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | tee deps-stage2/compiler.txt
          grep -q 'clang version 17.0.2' deps-stage2/compiler.txt
      - name: Fetch four versioned header libraries
        run: |
          set -euo pipefail
          for fn in build_eigen build_cgal build_cereal build_nlohmann_json; do
            timeout 120s bash scripts/build_deps.sh "$fn" 2>&1 | tee "deps-stage2/$fn.log"
          done
          for name in eigen cereal json; do
            git -C "scripts/build/$name" rev-parse HEAD | tee "deps-stage2/$name.commit"
          done
          sha256sum scripts/build/CGAL-5.6.tar.xz | tee deps-stage2/cgal.archive.sha256
      - name: Compile TBB for Android ARM64
        run: |
          set -euo pipefail
          timeout 240s bash scripts/build_deps.sh build_tbb 2>&1 | tee deps-stage2/tbb.log
          git -C scripts/build/oneTBB rev-parse HEAD | tee deps-stage2/tbb.commit
      - name: Validate header and archive outputs
        run: |
          set -euo pipefail
          ROOT=app/src/main/cpp/extern
          TOOL="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for f in eigen/include/Eigen/Core cgal/include/CGAL/version.h cereal/include/cereal/cereal.hpp nlohmann/include/nlohmann/json.hpp tbb/include/oneapi/tbb.h; do
            test -s "$ROOT/$f"
          done
          shopt -s nullglob
          archives=("$ROOT"/tbb/lib/arm64-v8a/*.a)
          test -s "$ROOT/tbb/lib/arm64-v8a/libtbb.a"
          for lib in "${archives[@]}"; do
            "$TOOL/llvm-ar" t "$lib" > "deps-stage2/$(basename "$lib").members.txt"
            "$TOOL/llvm-readelf" -h "$lib" > "deps-stage2/$(basename "$lib").elf.txt"
            grep -q AArch64 "deps-stage2/$(basename "$lib").elf.txt"
            if grep 'Machine:' "deps-stage2/$(basename "$lib").elf.txt" | grep -v AArch64; then exit 1; fi
            sha256sum "$lib" >> deps-stage2/sha256.txt
          done
          find "$ROOT"/{eigen,cgal,cereal,nlohmann,tbb}/include -type f -print0 | sort -z | xargs -0 sha256sum > deps-stage2/header-manifest.sha256
          echo "Five dependency outputs checked. Full engine and release remain HOLD."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightprint-arm64-stage2
          path: |
            deps-stage2/
            app/src/main/cpp/extern/eigen/
            app/src/main/cpp/extern/cgal/
            app/src/main/cpp/extern/cereal/
            app/src/main/cpp/extern/nlohmann/
            app/src/main/cpp/extern/tbb/
          retention-days: 7
