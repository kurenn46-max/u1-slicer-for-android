name: NIGHT PRINT trial checks

on:
  push:
    branches:
      - feature/nightprint-code-import-v1-20261122
  pull_request:
    paths:
      - 'app/src/main/java/com/u1/slicer/data/NightPrint*.kt'
      - 'app/src/test/java/com/u1/slicer/data/NightPrint*.kt'
      - 'app/src/main/java/com/u1/slicer/ui/SettingsScreen.kt'
      - 'app/src/main/java/com/u1/slicer/SlicerViewModel.kt'
      - '.github/workflows/nightprint-trial-check.yml'

permissions:
  contents: read

jobs:
  android-unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME" || (echo "ANDROID_HOME is missing" && exit 1)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Create ephemeral debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=NIGHT PRINT Trial,C=JP"
      - name: Compile experimental debug APK (no printer connection)
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Keep debug APK for private testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: night-print-trial-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Full JVM regression tests (no printer connection)
        run: bash ./gradlew --no-daemon testDebugUnitTest
