name: NIGHT PRINT release-gate tests

on:
  push:
    branches:
      - feature/nightprint-code-import-v1-20261122
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/nightprint-trial-check.yml'
  workflow_dispatch:

concurrency:
  group: nightprint-genesis-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate - regressions, APK, contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Create test-only signing key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Android Debug,O=NIGHT PRINT CI,C=JP"
      - name: Run complete JVM regression suite BEFORE APK distribution
        run: bash ./gradlew --no-daemon testDebugUnitTest
      - name: Compile Android debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Verify signed APK, separate package ID and arm64 slicer
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -1)
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 5000000
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -Fq "package: name='com.u1.slicer.orca.genesis'"
          echo "$BADGING" | grep -Fq "application-label:'NIGHT PRINT GENESIS TEST'"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -Z1 "$APK" | grep -Fxq 'lib/arm64-v8a/libprusaslicer-jni.so'
          echo "### NIGHT PRINT GENESIS automated gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Complete JVM test suite: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK compile, signature, package name, app label and arm64 native library: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Physical Android UI and real A1 mini print: NOT TESTED. NOT a production release." >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish test reports even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightprint-test-results-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Save QA-candidate APK ONLY after all gates pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nightprint-QA-candidate-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
