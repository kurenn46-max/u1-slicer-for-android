name: NIGHT PRINT diagnostic artifact inspection
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.ref_name == 'experiment/nightprint-phase3-log-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect Android runtime log from the failed emulator run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/kurenn46-max/u1-slicer-for-android/actions/artifacts/15127402148/zip > evidence.zip
          echo '29ffe464338563a96e1a2bc7e9d628978f9d78888203a7ae5efd3837f9799d84  evidence.zip' | sha256sum -c
          unzip -p evidence.zip nightprint-e2e-ci/native-android-logcat.txt > runtime.txt
          rg -A 18 -B 2 'FATAL EXCEPTION|AndroidRuntime|NIGHTPRINT' runtime.txt | head -220 || true
          unzip -Z1 evidence.zip | head -40
