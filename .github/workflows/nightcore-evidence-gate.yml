name: NIGHT CORE native evidence gate unit tests
on:
  pull_request:
    paths:
      - 'tools/nightcore/verify_native_evidence.py'
      - 'tools/nightcore/test_native_evidence.py'
      - 'tools/nightcore/recover_evidence.py'
      - 'tools/nightcore/operational_loop.py'
      - 'tools/nightcore/github_cycle.py'
      - 'tools/nightcore/test_operational_loop.py'
      - 'tools/nightcore/test_recover_evidence.py'
      - 'tools/nightcore/supervision.py'
      - 'tools/nightcore/github_supervisor.py'
      - 'tools/nightcore/nightprint_monitor.py'
      - 'tools/nightcore/test_supervision.py'
      - 'tools/nightcore/directive_rules.py'
      - 'tools/nightcore/directives.py'
      - 'tools/nightcore/directives.schema.json'
      - 'tools/nightcore/test_directives.py'
      - '.github/scripts/run-nightprint-android-e2e.sh'
      - '.github/workflows/nightcore-evidence-gate.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * *"
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  evidence-gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make the JSON Schema validator available
        run: |
          if ! python3 -c 'import jsonschema'; then
            python3 -m venv "$RUNNER_TEMP/nightcore-schema"
            "$RUNNER_TEMP/nightcore-schema/bin/pip" install --disable-pip-version-check --timeout 12 --retries 1 'jsonschema==4.25.1'
            echo "$RUNNER_TEMP/nightcore-schema/bin" >> "$GITHUB_PATH"
          fi
      - name: Check evidence gate and fail-closed cases
        run: python3 -m unittest discover -s tools/nightcore -p 'test_*.py' -v
      - name: Check shell syntax
        run: bash -n .github/scripts/run-nightprint-android-e2e.sh

      - name: Revalidate recovery with previously verified Android evidence
        if: github.repository == 'kurenn46-max/u1-slicer-for-android' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/nightcore-recovery-loop-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint=repos/kurenn46-max/u1-slicer-for-android/actions/artifacts/15120427540
          digest=1ccdd47456ffc769d4504c7ae010cfb837015012575b4776b0215265ebbab145
          if ! gh api "$endpoint/zip" > "$RUNNER_TEMP/nightcore-input.zip" 2>/dev/null; then
            echo "Cannot retrieve pinned Android evidence artifact 15120427540." >&2
            exit 1
          fi
          echo "$digest  $RUNNER_TEMP/nightcore-input.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/nightcore-input.zip" -d "$RUNNER_TEMP/nightcore-input"
          evidence="$RUNNER_TEMP/nightcore-input/nightprint-e2e-ci"
          python3 tools/nightcore/verify_native_evidence.py "$evidence"
          mkdir "$RUNNER_TEMP/nightcore-log-only"
          cp "$evidence/native-android-logcat.txt" "$RUNNER_TEMP/nightcore-log-only/"
          python3 tools/nightcore/recover_evidence.py "$RUNNER_TEMP/nightcore-log-only" \
            --output nightcore-recovery --source-sha "$(cat "$evidence/tested-source.txt")" \
            --recovery-sha "$(git rev-parse HEAD)" --instrumentation-exit 0 \
            --artifact-url https://github.com/kurenn46-max/u1-slicer-for-android/actions/runs/45825074561/artifacts/15120427540
          for report in raw-stl-native-evidence.json embedded-3mf-native-evidence.json; do
            diff <(jq -S . "$evidence/$report") <(jq -S . "nightcore-recovery/evidence/$report")
          done
      - name: Archive the recovery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightcore-recovery-${{ github.run_id }}
          path: nightcore-recovery/
          if-no-files-found: ignore
          retention-days: 14


  operational-loop:
    if: >-
      github.repository == 'kurenn46-max/u1-slicer-for-android' &&
      ((github.event_name == 'workflow_dispatch' && github.ref_name == 'experiment/nightcore-operational-loop-v2') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'experiment/nightcore-operational-loop-v2'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: nightcore-phase2-operations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Discover and process one CI result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/nightcore/github_cycle.py --branch experiment/nightcore-operational-loop-v2 \
            --run-id "$GITHUB_RUN_ID" --work "$RUNNER_TEMP/nightcore-cycle" --output nightcore-phase2
      - name: Exercise fault scenarios against real Android evidence
        if: github.event_name != 'schedule'
        run: |
          NIGHTCORE_REAL_EVIDENCE="$RUNNER_TEMP/nightcore-cycle/input-evidence" \
            python3 -m unittest discover -s tools/nightcore -p 'test_operational_loop.py' -v
      - name: Archive phase 2 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightcore-phase2-state
          path: nightcore-phase2/
          if-no-files-found: error
          retention-days: 14


  supervisor:
    if: >-
      github.repository == 'kurenn46-max/u1-slicer-for-android' &&
      ((github.event_name == 'workflow_dispatch' && contains(fromJSON('["experiment/nightcore-supervisor-v3","experiment/nightcore-command-v31"]'), github.ref_name)) ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["experiment/nightcore-supervisor-v3","experiment/nightcore-command-v31"]'), github.head_ref)) ||
       (github.event_name == 'schedule' && github.ref_name == github.event.repository.default_branch &&
        vars.NIGHTCORE_PHASE3_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NIGHTCORE_OBSERVATION_BRANCH: ${{ (github.head_ref == 'experiment/nightcore-command-v31' || github.ref_name == 'experiment/nightcore-command-v31') && 'experiment/nightcore-command-v31' || 'experiment/nightcore-supervisor-v3' }}
    concurrency:
      group: nightcore-phase3-supervision
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe open PRs and checkpoint evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          timeout --kill-after=10s 4m python3 tools/nightcore/github_supervisor.py \
            --branch "$NIGHTCORE_OBSERVATION_BRANCH" --run-id "$GITHUB_RUN_ID" --default-branch "$DEFAULT_BRANCH" \
            --work "$RUNNER_TEMP/nightcore-supervision" --output nightcore-phase3
      - name: Exercise Phase 3 on real Android evidence
        if: github.event_name == 'pull_request' && env.NIGHTCORE_OBSERVATION_BRANCH == 'experiment/nightcore-supervisor-v3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --kill-after=5s 90s python3 tools/nightcore/test_supervision.py --real-evidence
      - name: Make the JSON Schema validator available
        if: env.NIGHTCORE_OBSERVATION_BRANCH == 'experiment/nightcore-command-v31'
        run: |
          if ! python3 -c 'import jsonschema'; then
            python3 -m venv "$RUNNER_TEMP/nightcore-schema"
            "$RUNNER_TEMP/nightcore-schema/bin/pip" install --disable-pip-version-check --timeout 12 --retries 1 'jsonschema==4.25.1'
            echo "$RUNNER_TEMP/nightcore-schema/bin" >> "$GITHUB_PATH"
          fi
      - name: Generate and validate the Night handoff
        if: env.NIGHTCORE_OBSERVATION_BRANCH == 'experiment/nightcore-command-v31'
        run: python3 tools/nightcore/directives.py nightcore-phase31 --checkpoint nightcore-phase3/phase3.json
      - name: Verify Phase 3.1 against original CI logs
        if: github.event_name == 'pull_request' && env.NIGHTCORE_OBSERVATION_BRANCH == 'experiment/nightcore-command-v31'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout --kill-after=5s 140s python3 tools/nightcore/test_directives.py --live nightcore-phase31 nightcore-phase3/phase3.json
      - name: Publish the supervision summary
        if: always()
        run: |
          if [ -s nightcore-phase3/summary.md ]; then
            cat nightcore-phase3/summary.md >> "$GITHUB_STEP_SUMMARY"
            if [ -s nightcore-phase31/summary.md ]; then
              cat nightcore-phase31/summary.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "NIGHT CORE did not reach its first checkpoint." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save the checkpoint and local recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightcore-phase3-state-${{ github.run_attempt }}
          path: nightcore-phase3/
          if-no-files-found: error
          retention-days: 14

      - name: Save the validated command bundle
        if: always() && env.NIGHTCORE_OBSERVATION_BRANCH == 'experiment/nightcore-command-v31'
        uses: actions/upload-artifact@v4
        with:
          name: nightcore-phase31-directives
          path: nightcore-phase31/
          if-no-files-found: error
          retention-days: 14
