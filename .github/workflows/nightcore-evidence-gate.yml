name: NIGHT PRINT diagnostic artifact inspection
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.ref_name == 'experiment/nightprint-phase3-log-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect Android runtime log from the failed emulator run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/kurenn46-max/u1-slicer-for-android/actions/artifacts/15126539819/zip > evidence.zip
          echo '6ed5581aeb26734faaccea8f32316de60c7df2561f87ffd17392faac7e80bbd1  evidence.zip' | sha256sum -c
          unzip -p evidence.zip 'app/build/outputs/androidTest-results/connected/debug/TEST-*.xml' | grep -E -A 18 '<failure' | head -60 || true
