name: NIGHT PRINT native A1 mini E2E (real G-code)

on:
  workflow_call:
    inputs:
      reuse-verified-candidate:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  native-android:
    name: Execute real native A1 mini TPU .npjob slice on emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse-verified-candidate }}
        with:
          name: nightprint-native-engine-candidate
          path: native-candidate
      - name: Restore pinned JNI candidate for unchanged native source and build recipe
        if: inputs.reuse-verified-candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/check-nightprint-native-inputs.sh
          endpoint=repos/kurenn46-max/u1-slicer-for-android/actions/artifacts/15103919717
          digest=a0f846b523ef1e92fdf1311c89e1273384ee2f84733f4c0dedbc204ec622c061
          gh api "$endpoint" | jq -e --arg digest "sha256:$digest" '
            .id == 15103919717 and .name == "nightprint-native-engine-candidate"
            and .expired == false and .digest == $digest
            and .workflow_run.id == 45790909501 and .workflow_run.repository_id == 1390875009
            and .workflow_run.head_sha == "f2af90c8bc527152a008b6ca9839d831ef96449c"
          ' > /dev/null
          if ! gh api "$endpoint/zip" > "$RUNNER_TEMP/native-candidate.zip" 2>/dev/null; then
            echo "Cannot download pinned JNI candidate 15103919717." >&2
            exit 1
          fi
          echo "$digest  $RUNNER_TEMP/native-candidate.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/native-candidate.zip" -d native-candidate
      - name: Verify and install the accepted JNI engine
        shell: bash
        env:
          REUSE_CANDIDATE: ${{ inputs.reuse-verified-candidate }}
        run: |
          set -euo pipefail
          expected_source="$(git rev-parse HEAD)"
          if [ "$REUSE_CANDIDATE" = true ]; then
            expected_source=f31dc867b78da8c8a001b801136e0bf2ff558677
          fi
          test "$(cat native-candidate/source.txt)" = "$expected_source"
          sha256sum -c native-candidate/candidate.sha256
          install -m 644 native-candidate/libprusaslicer-jni.so app/src/main/jniLibs/arm64-v8a/libprusaslicer-jni.so
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK and one-time test signer
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$HOME/.android" nightprint-e2e-ci
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Android Test,O=NIGHT PRINT CI,C=JP"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify the engine packaged in the test APK
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$apk" lib/arm64-v8a/libprusaslicer-jni.so > nightprint-e2e-ci/packaged-engine.so
          expected=$(cut -d ' ' -f 1 native-candidate/candidate.sha256)
          actual=$(sha256sum nightprint-e2e-ci/packaged-engine.so | cut -d ' ' -f 1)
          rm nightprint-e2e-ci/packaged-engine.so
          echo "$actual" > nightprint-e2e-ci/packaged-engine.sha256
          test "$actual" = "$expected"
          sha256sum "$apk" > nightprint-e2e-ci/test-apk.sha256
      - name: Real native Android instrumentation (API 36, ARM translation)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/scripts/run-nightprint-android-e2e.sh
      - name: Verify and stage the exact APK used by instrumentation
        run: |
          set -euo pipefail
          sha256sum -c nightprint-e2e-ci/test-apk.sha256
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/apksigner" verify --print-certs "$apk" | tee nightprint-e2e-ci/apk-signature.txt
          "$tools/aapt" dump badging "$apk" > nightprint-e2e-ci/apk-badging.txt
          grep -Fq "package: name='com.u1.slicer.orca.genesis.qa4'" nightprint-e2e-ci/apk-badging.txt
          git rev-parse HEAD > nightprint-e2e-ci/tested-source.txt
          mkdir verified-apk
          cp "$apk" verified-apk/night-print-genesis-qa4-arm64.apk
          (cd verified-apk && sha256sum night-print-genesis-qa4-arm64.apk | tee SHA256SUMS)
      - name: Upload the verified installable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: nightprint-verified-qa4-apk-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: verified-apk/
      - name: Upload native instrumentation results (including failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightprint-native-android-e2e-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            nightprint-e2e-ci/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
      - name: Record outcome explicitly
        if: always()
        run: |
          echo "### NIGHT PRINT real native slice" >> "$GITHUB_STEP_SUMMARY"
          echo "This job runs actual Android JNI slicing rather than JVM mocks." >> "$GITHUB_STEP_SUMMARY"
          echo "A failed emulator/ABI install is NOT PASS; release remains HOLD." >> "$GITHUB_STEP_SUMMARY"
          echo "Hardware A1 mini printing is never performed by CI." >> "$GITHUB_STEP_SUMMARY"
